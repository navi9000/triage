<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Входящие заявки</title>
    <style>
      body {
        max-width: 40rem;
        margin: 2rem auto;
        padding: 0 1rem;
        font:
          1rem/1.5 system-ui,
          sans-serif;
      }
      textarea {
        box-sizing: border-box;
        display: block;
        width: 100%;
        margin: 0.5rem 0;
        padding: 0.5rem;
        font: inherit;
      }
      button {
        padding: 0.4rem 0.8rem;
        font: inherit;
      }
      pre {
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Входящие заявки</h1>
    <form>
      <label for="message">Текст заявки</label>
      <textarea id="message" rows="4"></textarea>
      <button type="submit">Разобрать заявку</button>
    </form>
    <pre id="result" aria-live="polite"></pre>
    <script type="module">
      const form = document.querySelector("form")
      const result = document.querySelector("#result")
      form.addEventListener("submit", async (event) => {
        event.preventDefault()
        const reply = await fetch("/api/triage", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            text: document.querySelector("#message").value,
          }),
        })
        const { status, topic, draft } = await reply.json()
        if (status === "ready") {
          result.innerHTML = `<strong>Тема:</strong> ${topic}<br /><strong>Черновик:</strong> ${draft}
          `
        } else if (status === "manual_review") {
          result.innerHTML =
            "<span style='color: red;'>Некорректный ответ модели. Требуется обработать заявку вручную</span>"
        } else {
          result.innerHTML =
            "<span style='color: red;'>Серверная ошибка. Недопустимый результат</span>"
        }
        // console.log({ responseJson })
        // result.textContent = JSON.stringify(await reply.json(), null, 2)
      })
    </script>
  </body>
</html>
